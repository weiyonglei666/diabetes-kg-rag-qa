<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>基于纯大模型的糖尿病问答系统</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
*{box-sizing:border-box}
    :root{--bg:#f7f7f8;--sidebar:#f3f4f6;--panel:#fff;--border:#e5e7eb;--text:#111827;--muted:#6b7280;--primary:#10a37f;--primary-hover:#0e8f70;--danger:#ef4444;--info:#2563eb;--shadow:0 1px 2px rgba(0,0,0,.05)}
    body{margin:0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
    .app{display:grid;grid-template-columns:300px 1fr;height:100vh}
    .sidebar{background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
    .sidebar-top,.brand-box,.sidebar-footer{padding:16px;border-bottom:1px solid var(--border)}
    .new-chat-btn,.top-mini-btn,.mini-btn,.primary-btn,.ghost-btn,.send-btn,.close-btn,.history-btn{border:none;border-radius:12px;cursor:pointer}
    .new-chat-btn{width:100%;padding:12px 14px;background:#fff;border:1px solid var(--border);font-weight:700}
    .search-box{margin-top:10px;display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 12px}
    .search-box input{border:none;outline:none;background:transparent;width:100%;font-size:14px}
    .brand{font-size:22px;font-weight:800;margin-bottom:8px}
    .brand-sub,.sidebar-footer,.hint,.role,.meta-label,.group-label{font-size:12px;color:var(--muted);line-height:1.7}
    .history{flex:1;overflow-y:auto;padding:12px;scrollbar-width:auto;scrollbar-color:#94a3b8 #e5e7eb}
    .history::-webkit-scrollbar,.chat::-webkit-scrollbar,.modal-body::-webkit-scrollbar{width:12px;height:12px}
    .history::-webkit-scrollbar-track,.chat::-webkit-scrollbar-track,.modal-body::-webkit-scrollbar-track{background:#e5e7eb;border-radius:999px}
    .history::-webkit-scrollbar-thumb,.chat::-webkit-scrollbar-thumb,.modal-body::-webkit-scrollbar-thumb{background:#94a3b8;border-radius:999px;border:2px solid #e5e7eb}
    .history-group{margin-bottom:14px}
    .group-label{font-weight:700;margin:2px 4px 10px}
    .history-item{padding:12px;border-radius:14px;margin-bottom:8px;border:1px solid transparent;background:transparent}
    .history-item:hover{background:#eceff3}.history-item.active{background:#fff;border-color:var(--border)}
    .history-row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.history-main{flex:1;min-width:0;cursor:pointer}
    .history-item-title{font-size:14px;font-weight:700;line-height:1.5;color:#1f2937;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .history-item-time{margin-top:6px;font-size:12px;color:var(--muted)}
    .history-actions{display:flex;gap:6px;flex-shrink:0}.history-btn{width:28px;height:28px;color:#fff;font-weight:700}.rename{background:#3b82f6}.delete{background:var(--danger)}
    .main{display:flex;flex-direction:column;height:100vh;background:#fff}
    .topbar{min-height:60px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:10px 20px;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.92);backdrop-filter:blur(8px)}
    .top-title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .top-mini-btn,.top-select{background:#eef2f7;color:#374151;padding:8px 12px;height:38px}.top-select{border:1px solid transparent;outline:none;border-radius:12px;min-width:220px}.top-status{font-size:13px;color:var(--muted)}
    .chat{flex:1;overflow-y:auto;padding:28px 0 40px}.chat-inner,.composer{width:min(920px,calc(100% - 32px));margin:0 auto}
    .welcome{text-align:center;color:var(--muted);padding:64px 20px 24px}.welcome-title{font-size:28px;font-weight:800;color:#1f2937;margin-bottom:10px}
    .welcome-examples{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}.chip{padding:10px 16px;border-radius:999px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:14px;color:#374151}
    .message-row{display:flex;gap:14px;align-items:flex-start;margin-bottom:28px}.avatar{width:34px;min-width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}.user{background:#2563eb}.bot{background:var(--primary)}
    .bubble-wrap{flex:1;min-width:0}.bubble{border-radius:16px;padding:16px 18px;line-height:1.9;font-size:16px;border:1px solid var(--border);white-space:pre-wrap;word-break:break-word;background:#f8fafc}
    .answer-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.mini-btn{background:#eef2f7;color:#374151;padding:8px 12px}
    .meta-box{margin-top:12px;border:1px solid var(--border);border-radius:14px;background:#fafafa;overflow:hidden}.meta-header{padding:10px 14px;background:#f3f4f6;font-size:13px;font-weight:700;color:#374151;display:flex;justify-content:space-between;cursor:pointer}.meta-content{display:none;padding:14px}.meta-content.show{display:block}
    .meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}.meta-item{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px}.meta-value{font-size:14px;line-height:1.7;word-break:break-word}
    .hint-card,.evidence-card{padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.8}.hint-card{border-left:4px solid var(--info);background:#eff6ff;color:#1e3a8a}.evidence-card{border:1px solid var(--border);background:#fff}
    .composer-wrap{border-top:1px solid var(--border);background:#fff;padding:16px 0 20px}.composer-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}.composer-modes{display:flex;gap:10px;flex-wrap:wrap}
    .toggle-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;height:38px;border-radius:12px;background:#eef2f7;color:#374151;font-size:13px;user-select:none;cursor:pointer}.toggle-chip input{accent-color:var(--primary);width:16px;height:16px;margin:0}
    .input-box{display:flex;gap:10px;align-items:flex-end;border:1px solid var(--border);border-radius:20px;padding:12px;background:#fff;box-shadow:var(--shadow)} textarea.msg{flex:1;border:none;resize:none;outline:none;font-size:16px;line-height:1.7;min-height:28px;max-height:180px;font-family:inherit;background:transparent}
    .send-btn{width:46px;height:46px;background:var(--primary);color:#fff;font-size:18px;font-weight:700}.send-btn:hover{background:var(--primary-hover)}.send-btn:disabled{opacity:.65;cursor:not-allowed}.error{color:#d93025}
    .typing{display:inline-flex;gap:6px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;animation:pulse 1.2s infinite ease-in-out}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes pulse{0%,80%,100%{opacity:.35;transform:scale(.75)}40%{opacity:1;transform:scale(1)}}
    .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}.modal-mask.show{display:flex}.modal{width:min(980px,100%);max-height:88vh;overflow:hidden;background:#fff;border-radius:20px;box-shadow:0 18px 60px rgba(15,23,42,.18);border:1px solid var(--border);display:flex;flex-direction:column}
    .modal-header{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-title{font-size:16px;font-weight:800}.modal-sub{font-size:12px;color:var(--muted);margin-top:4px}.close-btn{background:#eef2f7;color:#374151;width:36px;height:36px}
    .modal-body{padding:18px;overflow:auto}.section-title{font-size:14px;font-weight:700;margin:0 0 10px}.provider-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}.provider-card{border:1px solid var(--border);border-radius:14px;padding:12px;background:#f8fafc;cursor:pointer}.provider-card:hover{border-color:#cbd5e1;background:#fff}.provider-name{font-size:14px;font-weight:700;margin-bottom:6px}.provider-desc{font-size:12px;color:var(--muted);line-height:1.6}
    .form-card{border:1px solid var(--border);border-radius:16px;padding:14px;background:#fbfdff}.config-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.config-item{display:flex;flex-direction:column;gap:6px}.config-item.full{grid-column:1 / -1}.config-input,.config-select,.config-textarea{border:1px solid var(--border);background:#fff;color:#111827;font-size:14px;padding:10px 12px;border-radius:12px;font-family:inherit}.config-textarea{min-height:72px;resize:vertical}
    .row-actions,.saved-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.primary-btn{background:var(--primary);color:#fff;padding:10px 14px}.ghost-btn{background:#eef2f7;color:#374151;padding:10px 14px}.saved-list{display:grid;gap:10px;margin-top:16px}.saved-item{border:1px solid var(--border);border-radius:14px;padding:12px;background:#fff}.saved-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.saved-name{font-size:14px;font-weight:700}.saved-meta{margin-top:6px;color:var(--muted);font-size:12px;line-height:1.7;word-break:break-all}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f7;font-size:12px;color:#475569;margin-right:6px}

    .graph-modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
    .graph-modal.show{display:flex}
    .graph-box{width:min(1040px,95vw);height:min(720px,90vh);background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden}
    .graph-head{height:58px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700}
    .graph-close{border:none;background:#eef2f7;border-radius:10px;padding:8px 12px;cursor:pointer}
    .graph-canvas-wrap{flex:1;min-height:420px;background:#f8fafc}
    #graphNetwork{width:100%;height:100%;min-height:420px}
    .badge{display:inline-block;padding:2px 8px;border-radius:999px;color:#fff;font-size:12px;margin-right:6px}
    .badge.rag{background:#0891b2}.badge.kg{background:#7c3aed}.badge.fusion{background:#059669}
    .icon-font{display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:14px}
    .new-chat-btn .icon-font{margin-right:6px}
    .search-box .icon-font{color:var(--muted);flex-shrink:0}
    .send-btn .icon-font{font-size:17px}
    .history-btn .icon-font,.close-btn .icon-font{font-size:14px}

    @media (max-width:960px){.app{grid-template-columns:1fr}.sidebar{display:none}.meta-grid,.config-grid,.provider-grid{grid-template-columns:1fr}.topbar{padding:10px 14px}.modal{max-height:92vh}}

    /* ===== Unified visual compatibility aliases ===== */
    .icon,.icon-inline,.search-icon{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      line-height:1;
      font-size:14px;
      flex-shrink:0;
    }
    .search-box .icon,.search-box .icon-inline,.search-box .search-icon{
      color:var(--muted);
      flex:0 0 auto;
    }
    .new-chat-btn,.top-mini-btn,.mini-btn,.primary-btn,.ghost-btn,.send-btn,.close-btn,.history-btn,.graph-close{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
    }
    .send-btn .icon,.send-btn .icon-inline,.send-btn .icon-font{font-size:17px}
    .history-btn .icon,.history-btn .icon-inline,.history-btn .icon-font,
    .close-btn .icon,.close-btn .icon-inline,.close-btn .icon-font{font-size:14px;pointer-events:none}
    .graph-body,.graph-canvas-wrap{flex:1;min-height:420px;background:#f8fafc;position:relative;overflow:auto}
    .graph-body #graphNetwork,.graph-canvas-wrap #graphNetwork{width:100%;height:100%;min-height:420px}
    .evidence-title{font-size:13px;font-weight:700;color:#374151;margin-bottom:10px}
    .evidence-text{font-size:14px;line-height:1.8;color:#4b5563}
    .code-box{
      background:#111827;
      color:#e5e7eb;
      border-radius:12px;
      padding:12px;
      font-family:Consolas,monospace;
      font-size:12px;
      line-height:1.7;
      white-space:pre-wrap;
      word-break:break-word;
      max-height:260px;
      overflow:auto;
      margin-bottom:14px;
    }
    .button-icon{pointer-events:none}
    .top-mini-btn i,.mini-btn i,.primary-btn i,.ghost-btn i,.graph-close i,.new-chat-btn i{pointer-events:none}
    textarea:not(.msg){
      flex:1;
      border:none;
      resize:none;
      outline:none;
      font-size:16px;
      line-height:1.7;
      min-height:28px;
      max-height:180px;
      font-family:inherit;
      background:transparent;
    }
    .history-title{
      font-size:12px;
      color:var(--muted);
      font-weight:700;
      margin:2px 4px 10px;
    }
    .top-mini-btn:hover,.mini-btn:hover,.ghost-btn:hover,.graph-close:hover,.close-btn:hover,.toggle-chip:hover{
      background:#e5ebf3;
    }
    .chip:hover,.provider-card:hover{
      background:#fff;
      border-color:#cbd5e1;
    }

  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand-box">
        <div class="brand">基于纯大模型的糖尿病问答系统</div>
        <div class="brand-sub">保留 5 个内置模型展示名，支持多个自定义 API 配置，历史会话支持搜索、日期分组和滚动浏览。</div>
      </div>
      <div class="sidebar-top">
        <button id="newChatBtn" class="new-chat-btn"><i class="fa-solid fa-plus icon-font" aria-hidden="true"></i>新建会话</button>
        <div class="search-box"><span class="search-icon"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></span><input id="historySearchInput" placeholder="搜索历史会话标题或消息内容" /></div>
      </div>
      <div class="history"><div id="historyList"></div></div>
      <div class="sidebar-footer">后端地址：<span id="apiBaseText"></span><br />左侧历史区已支持搜索、按日期分组和可见滚动条。</div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="top-title" id="topTitle">新对话</div>
        <div class="top-right">
          <select id="modelSelect" class="top-select"></select>
          <button id="configBtn" class="top-mini-btn"><i class="fa-solid fa-sliders icon-font" aria-hidden="true"></i> 模型 / API 配置</button>
          <button id="renameSessionBtn" class="top-mini-btn"><i class="fa-solid fa-pen-to-square icon-font" aria-hidden="true"></i> 重命名会话</button>
          <button id="exportTextBtn" class="top-mini-btn"><i class="fa-solid fa-file-lines icon-font" aria-hidden="true"></i> 导出文本</button>
          <button id="exportImageBtn" class="top-mini-btn"><i class="fa-solid fa-image icon-font" aria-hidden="true"></i> 导出截图</button>
          <div class="top-status" id="modeSummary">标准模式</div>
        </div>
      </div>
      <div class="chat" id="chat"><div class="chat-inner" id="chatInner"></div></div>
      <div class="composer-wrap">
        <div class="composer">
          <div class="composer-toolbar"><div class="composer-modes"><label class="toggle-chip"><input type="checkbox" id="thinkingToggle" checked /><span>深度思考</span></label><label class="toggle-chip"><input type="checkbox" id="webToggle" /><span>联网模式</span></label></div></div>
          <div class="input-box"><textarea id="questionInput" class="msg" rows="1" placeholder="输入你的问题，按 Enter 发送，Shift + Enter 换行"></textarea><button id="sendBtn" class="send-btn" aria-label="发送"><i class="fa-solid fa-paper-plane icon-font" aria-hidden="true"></i></button></div>
          <div id="errorBox" class="hint error"></div>
          <div class="hint">内置模型显示为 deepseek-v3 / deepseek-r1 / kimi-2.5 / glm-5.1 / qwen-3.6；实际调用模型信息会在回答详情里显示。</div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-mask" id="configModal">
    <div class="modal">
      <div class="modal-header"><div><div class="modal-title">模型 / API 配置中心</div><div class="modal-sub">新增、编辑、删除多个配置；保存后立刻出现在顶部下拉框，但不影响聊天主界面布局。</div></div><button id="closeConfigBtn" class="close-btn" aria-label="关闭"><i class="fa-solid fa-xmark icon-font" aria-hidden="true"></i></button></div>
      <div class="modal-body">
        <div class="section-title">快捷填充模板</div><div id="providerGrid" class="provider-grid"></div>
        <div class="section-title">编辑区</div>
        <div class="form-card">
          <div class="config-grid">
            <div class="config-item"><label for="configNameInput">配置名称</label><input id="configNameInput" class="config-input" placeholder="例如：我的 OpenAI / 公司转发网关" /></div>
            <div class="config-item"><label for="providerSelect">供应商</label><select id="providerSelect" class="config-select"></select></div>
            <div class="config-item"><label for="customModelInput">模型 ID</label><input id="customModelInput" class="config-input" placeholder="例如：gpt-4o-mini / deepseek-chat / qwen-plus" /></div>
            <div class="config-item"><label for="baseUrlInput">Base URL</label><input id="baseUrlInput" class="config-input" placeholder="例如：https://api.openai.com/v1" /></div>
            <div class="config-item full"><label for="apiKeyInput">API Key</label><input id="apiKeyInput" class="config-input" placeholder="保存在当前浏览器 localStorage" /></div>
            <div class="config-item full"><label for="configNoteInput">备注</label><textarea id="configNoteInput" class="config-textarea" placeholder="可选：记录用途，例如国际接口 / 本地中转 / 测试账号"></textarea></div>
          </div>
          <div class="row-actions"><button id="saveConfigBtn" class="primary-btn"><i class="fa-solid fa-floppy-disk icon-font" aria-hidden="true"></i> 保存配置</button><button id="resetConfigBtn" class="ghost-btn"><i class="fa-solid fa-rotate-right icon-font" aria-hidden="true"></i> 重置编辑区</button></div>
        </div>
        <div class="section-title" style="margin-top:18px;">已保存的自定义配置</div><div id="savedConfigList" class="saved-list"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8002";
    const STORAGE_KEY = "dm_llm_chat_sessions_v6";
    const LAST_MODEL_KEY = "dm_llm_last_model_v6";
    const THINKING_TOGGLE_KEY = "dm_llm_enable_thinking_v6";
    const WEB_TOGGLE_KEY = "dm_llm_enable_web_v6";
    const CUSTOM_CONFIGS_KEY = "dm_llm_custom_configs_v6";
    const BUILTIN_MODELS = [
      { value: "deepseek-v3", label: "deepseek-v3（内置免费）", provider: "DeepSeek" },
      { value: "deepseek-r1", label: "deepseek-r1（内置免费）", provider: "DeepSeek" },
      { value: "kimi-2.5", label: "kimi-2.5（内置免费）", provider: "Moonshot" },
      { value: "glm-5.1", label: "glm-5.1（内置免费）", provider: "智谱 GLM" },
      { value: "qwen-3.6", label: "qwen-3.6（内置免费）", provider: "阿里云百炼" }
    ];
    const PROVIDER_TEMPLATES = [
      { provider: "OpenAI", model: "gpt-4o-mini", base_url: "https://api.openai.com/v1", desc: "国际 · OpenAI 官方兼容接口" },
      { provider: "Anthropic", model: "claude-sonnet-4-20250514", base_url: "https://api.anthropic.com/v1", desc: "国际 · 如走兼容网关更稳" },
      { provider: "Google Gemini", model: "gemini-2.5-pro", base_url: "https://generativelanguage.googleapis.com/v1beta/openai/", desc: "国际 · Gemini OpenAI 兼容端点" },
      { provider: "xAI", model: "grok-3-mini", base_url: "https://api.x.ai/v1", desc: "国际 · xAI 兼容接口" },
      { provider: "DeepSeek", model: "deepseek-chat", base_url: "https://api.deepseek.com/v1", desc: "国内 · DeepSeek 官方接口" },
      { provider: "Moonshot", model: "kimi-k2.5", base_url: "https://api.moonshot.cn/v1", desc: "国内 · Kimi 官方接口" },
      { provider: "智谱 GLM", model: "glm-4.5-air", base_url: "https://open.bigmodel.cn/api/paas/v4", desc: "国内 · 智谱官方接口" },
      { provider: "阿里云百炼", model: "qwen-plus", base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1", desc: "国内 · 百炼兼容接口" },
      { provider: "硅基流动", model: "deepseek-ai/DeepSeek-V3", base_url: "https://api.siliconflow.cn/v1", desc: "国内 · OpenAI 兼容网关" },
      { provider: "OpenRouter", model: "openai/gpt-4o-mini", base_url: "https://openrouter.ai/api/v1", desc: "国际 · 多模型聚合平台" },
      { provider: "Ollama", model: "qwen2.5:7b", base_url: "http://localhost:11434/v1", desc: "本地 · Ollama OpenAI 兼容端点" },
      { provider: "自定义兼容网关", model: "your-model", base_url: "https://your-api.example.com/v1", desc: "自定义 · 任意兼容接口" }
    ];

    const configModal = document.getElementById("configModal"), configBtn = document.getElementById("configBtn"), closeConfigBtn = document.getElementById("closeConfigBtn"), providerGrid = document.getElementById("providerGrid"), providerSelect = document.getElementById("providerSelect"), configNameInput = document.getElementById("configNameInput"), customModelInput = document.getElementById("customModelInput"), baseUrlInput = document.getElementById("baseUrlInput"), apiKeyInput = document.getElementById("apiKeyInput"), configNoteInput = document.getElementById("configNoteInput"), saveConfigBtn = document.getElementById("saveConfigBtn"), resetConfigBtn = document.getElementById("resetConfigBtn"), savedConfigList = document.getElementById("savedConfigList");

    function renderModelSelect(selectedValue){ const all = getAllModelOptions(); modelSelect.innerHTML = `<optgroup label="内置免费模型">${BUILTIN_MODELS.map(m => `<option value="${m.value}">${m.label}</option>`).join("")}</optgroup>` + (customConfigs.length ? `<optgroup label="自定义配置">${customConfigs.map(c => `<option value="custom:${c.id}">${escapeHtml(c.name)}（自定义）</option>`).join("")}</optgroup>` : ""); const target = all.find(x => x.value === selectedValue) ? selectedValue : BUILTIN_MODELS[0].value; modelSelect.value = target; localStorage.setItem(LAST_MODEL_KEY, target); }

    function createSession(title="新对话"){ const session={ id:uid("s"), title, created_at:new Date().toISOString(), preferred_model:modelSelect.value || getStoredModel(), enable_thinking:thinkingToggle.checked, enable_web_search:webToggle.checked, messages:[] }; sessions.unshift(session); saveSessions(); return session; }
    function ensureSession(){ if(!sessions.length){ const s=createSession(); currentSessionId=s.id; } else if(!currentSessionId){ currentSessionId=sessions[0].id; } }
    function formatTime(iso){ const d=new Date(iso); const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'), h=String(d.getHours()).padStart(2,'0'), min=String(d.getMinutes()).padStart(2,'0'); return `${y}-${m}-${day} ${h}:${min}`; }
    function getRelativeGroup(iso){ const d=new Date(iso); const now=new Date(); const startToday=new Date(now.getFullYear(), now.getMonth(), now.getDate()); const startTarget=new Date(d.getFullYear(), d.getMonth(), d.getDate()); const diff=Math.round((startToday - startTarget)/(24*3600*1000)); if(diff===0) return "今天"; if(diff===1) return "昨天"; if(diff<=7) return "近7天"; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
    function sessionSearchText(s){ return [s.title, ...(s.messages||[]).map(m => `${m.content || ''} ${m.model_name || ''} ${m.actual_model || ''}`)].join(" ").toLowerCase(); }
    function renderHistory(){ const q=(historySearchInput.value || "").trim().toLowerCase(); const filtered=sessions.filter(s => !q || sessionSearchText(s).includes(q)); const groups={}; filtered.forEach(s => { const k=getRelativeGroup(s.created_at); if(!groups[k]) groups[k]=[]; groups[k].push(s); }); const groupOrder=Object.keys(groups).sort((a,b)=>{ const special=["今天","昨天","近7天"]; const ia=special.indexOf(a), ib=special.indexOf(b); if(ia!==-1 || ib!==-1){ return (ia===-1?99:ia) - (ib===-1?99:ib); } return a < b ? 1 : -1; }); historyList.innerHTML = filtered.length ? groupOrder.map(group => `<div class="history-group"><div class="group-label">${group}</div>${groups[group].map(s => `<div class="history-item ${s.id===currentSessionId?'active':''}"><div class="history-row"><div class="history-main" onclick="selectSession('${s.id}')"><div class="history-item-title">${escapeHtml(s.title || '新对话')}</div><div class="history-item-time">${formatTime(s.created_at)} · ${(s.messages||[]).length} 条</div></div><div class="history-actions"><button class="history-btn rename" title="重命名" aria-label="重命名" onclick="renameSession('${s.id}')"><i class="fa-solid fa-pen-to-square" aria-hidden="true"></i></button><button class="history-btn delete" title="删除" aria-label="删除" onclick="deleteSession('${s.id}')"><i class="fa-solid fa-trash" aria-hidden="true"></i></button></div></div></div>`).join("")}</div>`).join("") : `<div class="hint">没有匹配到历史会话。</div>`; }
    function clearWelcome(){ const welcome = chatInner.querySelector('.welcome'); if(welcome) welcome.remove(); }
    function welcomeHtml(){ return `<div class="welcome"><div class="welcome-title">今天想了解什么？</div><div>你可以提问糖尿病定义、症状、治疗、药物、不良反应、检查、英文名等问题。</div><div class="welcome-examples"><div class="chip">糖尿病视网膜病变的主要症状是什么？</div><div class="chip">格列本脲有哪些不良反应？</div><div class="chip">妊娠期糖尿病的英文名称是什么？</div><div class="chip">2型糖尿病的治疗方法有哪些？</div><div class="chip">糖尿病常见检查项目有哪些？</div></div></div>`; }
    function renderUserHtml(text, modelName=""){ return `<div class="message-row"><div class="avatar user">问</div><div class="bubble-wrap"><div class="role">你 ${modelName ? `· 模型 ${escapeHtml(modelName)}` : ''}</div><div class="bubble">${escapeHtml(text)}</div></div></div>`; }
    function renderBotHtml(msg, index){ const metaId=uid('meta'); return `<div class="message-row"><div class="avatar bot">答</div><div class="bubble-wrap"><div class="role">系统 · ${escapeHtml(msg.model_name || '-')}</div><div class="bubble">${escapeHtml(msg.content || '')}</div><div class="answer-actions"><button class="mini-btn copy-btn" data-index="${index}">复制回答</button></div><div class="meta-box"><div class="meta-header" onclick="toggleMeta('${metaId}')"><span>查看模型回答信息</span><span>展开 / 收起</span></div><div class="meta-content" id="${metaId}"><div class="meta-grid"><div class="meta-item"><div class="meta-label">展示模型</div><div class="meta-value">${escapeHtml(msg.model_name || '-')}</div></div><div class="meta-item"><div class="meta-label">实际调用模型</div><div class="meta-value">${escapeHtml(msg.actual_model || '-')}</div></div><div class="meta-item"><div class="meta-label">供应商</div><div class="meta-value">${escapeHtml(msg.provider_name || '-')}</div></div><div class="meta-item"><div class="meta-label">Base URL</div><div class="meta-value">${escapeHtml(msg.base_url || '-')}</div></div><div class="meta-item"><div class="meta-label">API Key</div><div class="meta-value">${escapeHtml(msg.api_key_masked || '-')}</div></div><div class="meta-item"><div class="meta-label">系统提示</div><div class="meta-value">${escapeHtml(msg.system_hint || SYSTEM_HINT)}</div></div><div class="meta-item"><div class="meta-label">模式开关</div><div class="meta-value">${msg.enable_thinking ? '深度思考：开' : '深度思考：关'} / ${msg.enable_web_search ? '联网模式：开' : '联网模式：关'}</div></div><div class="meta-item"><div class="meta-label">识别实体</div><div class="meta-value">${escapeHtml(msg.entity || '未识别')}</div></div><div class="meta-item"><div class="meta-label">问题类型</div><div class="meta-value">${escapeHtml(msg.intent || '-')}</div></div><div class="meta-item"><div class="meta-label">总响应时间</div><div class="meta-value">${escapeHtml(msg.total_time_sec ?? '-')} 秒</div></div></div><div class="evidence-card">当前页面为纯大模型问答模式，不依赖知识图谱检索，因此不展示 Cypher 与图谱证据链。回答内容由所选大语言模型直接生成。</div><div style="height:12px"></div><div class="hint-card">提示：内置下拉显示名固定为 deepseek-v3 / deepseek-r1 / kimi-2.5 / glm-5.1 / qwen-3.6，详情处显示实际调用模型。</div></div></div></div></div>`; }
    function renderCurrentSession(){ const session=getCurrentSession(); chatInner.innerHTML=''; topTitle.textContent=session?.title || '新对话'; if(!session || !session.messages.length){ chatInner.innerHTML = welcomeHtml(); bindChips(); return; } let botIndex=0; session.messages.forEach(msg=>{ chatInner.insertAdjacentHTML('beforeend', msg.role==='user' ? renderUserHtml(msg.content, msg.model_name) : renderBotHtml(msg, botIndex++)); }); bindMessageActionButtons(); scrollToBottom(); }

    async function typewriter(el, text, speed=10){ el.textContent=''; for(let i=0;i<text.length;i++){ el.textContent += text[i]; scrollToBottom(); await new Promise(r=>setTimeout(r,speed)); } }
    function addBotLoading(){ const id=uid('loading'); chatInner.insertAdjacentHTML('beforeend', `<div class="message-row" id="${id}"><div class="avatar bot">答</div><div class="bubble-wrap"><div class="role">系统 · ${escapeHtml(modelSelect.value)}</div><div class="bubble"><span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div></div></div>`); scrollToBottom(); return id; }
    function selectedCustomConfig(){ if(!modelSelect.value.startsWith('custom:')) return null; const id=modelSelect.value.slice(7); const cfg=customConfigs.find(x=>x.id===id); if(!cfg) return null; return { config_id: cfg.id, display_name: cfg.name, provider_name: cfg.provider, base_url: cfg.base_url, api_key: cfg.api_key, model: cfg.model, note: cfg.note || '' }; }
    function addUserMessageToSession(text){ const session=getCurrentSession(); if(!session) return; if(!session.messages.length){ session.title = text.length > 18 ? text.slice(0,18) + '...' : text; } session.preferred_model = modelSelect.value; session.enable_thinking = thinkingToggle.checked; session.enable_web_search = webToggle.checked; session.messages.push({ role:'user', content:text, model_name:modelSelect.value, created_at:new Date().toISOString() }); saveSessions(); renderHistory(); clearWelcome(); chatInner.insertAdjacentHTML('beforeend', renderUserHtml(text, modelSelect.value)); scrollToBottom(); topTitle.textContent=session.title; }
    async function addBotMessageToSession(data, loadingId){ const loadingEl=document.getElementById(loadingId); if(loadingEl) loadingEl.remove(); const session=getCurrentSession(); if(!session) return; const botMsg={ role:'bot', content:data.answer || '未返回答案。', entity:data.entity || '', intent:data.intent || '', model_name:data.model_name || modelSelect.value, actual_model:data.actual_model || '', provider_name:data.provider_name || '', base_url:data.base_url || '', api_key_masked:data.api_key_masked || '', system_hint: data.system_hint || (thinkingToggle.checked ? SYSTEM_HINT : '未开启深度思考提示'), enable_thinking:thinkingToggle.checked, enable_web_search:webToggle.checked, retrieved_count:data.retrieved_count ?? 0, retrieval_time_sec:data.retrieval_time_sec ?? 0, generation_time_sec:data.generation_time_sec ?? 0, total_time_sec:data.total_time_sec ?? 0, created_at:new Date().toISOString() }; session.messages.push(botMsg); saveSessions(); renderHistory(); clearWelcome(); const tempId=uid('bot'); chatInner.insertAdjacentHTML('beforeend', `<div class="message-row" id="${tempId}"><div class="avatar bot">答</div><div class="bubble-wrap"><div class="role">系统 · ${escapeHtml(botMsg.model_name)}</div><div class="bubble" id="${tempId}_bubble"></div></div></div>`); await typewriter(document.getElementById(`${tempId}_bubble`), botMsg.content, 10); document.getElementById(tempId)?.remove(); const botIndex=session.messages.filter(m=>m.role==='bot').length - 1; chatInner.insertAdjacentHTML('beforeend', renderBotHtml(botMsg, botIndex)); bindMessageActionButtons(); scrollToBottom(); }
    async function askQuestion(prefill=null){ const question=(prefill ?? questionInput.value).trim(); if(!question) return; errorBox.textContent=''; addUserMessageToSession(question); questionInput.value=''; autoResize(questionInput); sendBtn.disabled=true; modelSelect.disabled=true; const loadingId=addBotLoading(); try{ const response=await fetch(`${API_BASE}/qa`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ question, model_name:modelSelect.value.startsWith('custom:') ? 'custom' : modelSelect.value, enable_thinking:thinkingToggle.checked, enable_web_search:webToggle.checked, custom_model_config:selectedCustomConfig() }) }); if(!response.ok){ throw new Error(`请求失败：${response.status} ${await response.text()}`); } const data=await response.json(); await addBotMessageToSession(data, loadingId); } catch(err){ document.getElementById(loadingId)?.remove(); const session=getCurrentSession(); if(session){ session.messages.push({ role:'bot', content:'请求失败，请检查纯大模型后端服务、接口地址或模型配置。', intent:'error', model_name:modelSelect.value, actual_model:'', provider_name:'', base_url:'', api_key_masked:'', created_at:new Date().toISOString() }); saveSessions(); } renderCurrentSession(); renderHistory(); errorBox.textContent = err.message || '发生未知错误。'; } finally { sendBtn.disabled=false; modelSelect.disabled=false; } }
    function selectSession(id){ currentSessionId=id; const session=getCurrentSession(); if(session?.preferred_model) renderModelSelect(session.preferred_model); thinkingToggle.checked = session?.enable_thinking ?? getStoredBool(THINKING_TOGGLE_KEY, true); webToggle.checked = session?.enable_web_search ?? getStoredBool(WEB_TOGGLE_KEY, false); refreshModeSummary(); renderHistory(); renderCurrentSession(); }
    function deleteSession(id){ const target=sessions.find(s=>s.id===id); if(!target) return; if(!confirm(`确定删除会话“${target.title || '新对话'}”吗？`)) return; sessions=sessions.filter(s=>s.id!==id); if(!sessions.length){ const s=createSession(); currentSessionId=s.id; } else if(currentSessionId===id){ currentSessionId=sessions[0].id; } saveSessions(); renderHistory(); renderCurrentSession(); }

    window.selectSession=selectSession; window.deleteSession=deleteSession; window.renameSession=renameSession; window.toggleMeta=(id)=>document.getElementById(id)?.classList.toggle('show');

    function resetConfigEditor(){ editingConfigId=''; configNameInput.value=''; providerSelect.value=PROVIDER_TEMPLATES[0].provider; customModelInput.value=''; baseUrlInput.value=''; apiKeyInput.value=''; configNoteInput.value=''; }
    function applyTemplate(t){ providerSelect.value=t.provider; if(!configNameInput.value.trim()) configNameInput.value=`我的${t.provider}`; if(!customModelInput.value.trim()) customModelInput.value=t.model; if(!baseUrlInput.value.trim()) baseUrlInput.value=t.base_url; }

    function editConfig(id){ const cfg=customConfigs.find(x=>x.id===id); if(!cfg) return; editingConfigId=id; configNameInput.value=cfg.name || ''; providerSelect.value=cfg.provider || PROVIDER_TEMPLATES[0].provider; customModelInput.value=cfg.model || ''; baseUrlInput.value=cfg.base_url || ''; apiKeyInput.value=cfg.api_key || ''; configNoteInput.value=cfg.note || ''; openConfigModal(); }

    exportTextBtn.addEventListener('click', ()=>{ const s=getCurrentSession(); if(!s) return; let content=`糖尿病纯大模型问答系统\n会话名称：${s.title}\n创建时间：${formatTime(s.created_at)}\n默认模型：${s.preferred_model || '-'}\n系统提示：${SYSTEM_HINT}\n深度思考：${thinkingToggle.checked?'开启':'关闭'}\n联网模式：${webToggle.checked?'开启':'关闭'}\n\n`; (s.messages||[]).forEach(msg=>{ if(msg.role==='user'){ content += `【用户】${msg.content}\n模型：${msg.model_name || '-'}\n\n`; } else { content += `【系统】${msg.content}\n展示模型：${msg.model_name || '-'}\n实际调用模型：${msg.actual_model || '-'}\n供应商：${msg.provider_name || '-'}\nBase URL：${msg.base_url || '-'}\n问题类型：${msg.intent || '-'}\n识别实体：${msg.entity || '-'}\n总响应时间：${msg.total_time_sec || 0} 秒\n\n`; }}); const blob=new Blob([content], {type:'text/plain;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${s.title || '会话记录'}.txt`; a.click(); URL.revokeObjectURL(a.href); });
    exportImageBtn.addEventListener('click', async ()=>{ const s=getCurrentSession(); if(!s) return; try{ const canvas=await html2canvas(document.getElementById('chatInner'), { backgroundColor:'#ffffff', scale:2, useCORS:true }); const a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download=`${s.title || '会话截图'}.png`; a.click(); }catch{ alert('截图导出失败，请稍后重试。'); } });
